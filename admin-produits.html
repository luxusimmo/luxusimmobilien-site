<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LUXUSIMMOBILIEN — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css" />
<style>
  body { background: #050505; color: #fff; font-family: 'Inter', sans-serif; padding-top: 100px; }
  .admin-container { max-width: 900px; margin: 0 auto; padding: 20px; }
  
  /* Onglets */
  .admin-tabs { display: flex; gap: 10px; margin-bottom: 30px; border-bottom: 1px solid #333; padding-bottom: 15px; }
  .admin-tab { background: none; border: none; color: #888; font-size: 18px; font-weight: 600; cursor: pointer; padding: 5px 10px; transition: 0.3s; font-family: 'Space Grotesk', sans-serif; }
  .admin-tab.active { color: #fff; border-bottom: 2px solid #fff; }

  .admin-box { background: #111; border: 1px solid #222; border-radius: 8px; padding: 30px; margin-bottom: 30px; }
  .admin-box h2 { font-family: 'Space Grotesk', sans-serif; margin-bottom: 20px; font-size: 24px; }
  .form-group { margin-bottom: 15px; }
  .form-group label { display: block; font-size: 13px; color: #888; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 1px; }
  .form-group input, .form-group select, .form-group textarea {
    width: 100%; padding: 12px; background: #050505; border: 1px solid #333; color: #fff; border-radius: 4px; font-family: inherit;
  }
  .form-group input:focus, .form-group select:focus { outline: none; border-color: #fff; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
  .btn-submit { background: #fff; color: #000; border: none; padding: 15px 30px; font-weight: 600; cursor: pointer; border-radius: 4px; width: 100%; transition: 0.3s; margin-top: 20px; }
  .btn-submit:hover { background: #ccc; }
  
  /* Langues */
  .lang-tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 1px solid #333; padding-bottom: 10px; flex-wrap: wrap; }
  .lang-tab { background: none; border: none; color: #888; cursor: pointer; font-size: 15px; padding: 8px 15px; border-radius: 4px; transition: 0.3s; font-weight: 600; }
  .lang-tab.active { background: #fff; color: #000; }
  .lang-content { display: none; }
  .lang-content.active { display: block; animation: fadeIn 0.3s; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  /* Listes */
  .list-item { display: flex; justify-content: space-between; align-items: center; padding: 15px; border-bottom: 1px solid #222; flex-wrap: wrap; gap: 10px; }
  .list-item img { width: 60px; height: 60px; object-fit: cover; border-radius: 4px; margin-right: 15px; }
  .item-info { flex: 1; min-width: 200px; }
  .item-info h4 { margin: 0 0 5px 0; font-size: 16px; }
  .item-info p { margin: 0; font-size: 13px; color: #888; }
  .btn-delete { background: none; border: 1px solid #ff4444; color: #ff4444; padding: 8px 12px; border-radius: 4px; cursor: pointer; transition: 0.3s; }
  .btn-delete:hover { background: #ff4444; color: #fff; }
  
  .login-view { max-width: 400px; margin: 15vh auto; background: #111; padding: 40px; border-radius: 8px; border: 1px solid #222; }
  .login-view h2 { text-align: center; margin-bottom: 20px; font-family: 'Space Grotesk'; }
</style>
</head>
<body>

<!-- Vue Connexion -->
<div id="login-view" class="login-view">
  <h2>Espace Admin</h2>
  <div class="form-group">
    <input type="email" id="email" placeholder="E-mail" required />
  </div>
  <div class="form-group">
    <input type="password" id="password" placeholder="Mot de passe" required />
  </div>
  <button class="btn-submit" onclick="login()">Se connecter</button>
</div>

<!-- Vue Admin -->
<div id="admin-view" class="admin-container" style="display: none;">
  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
    <h2 style="font-family: 'Space Grotesk'; margin: 0;">Tableau de bord</h2>
    <button class="btn-delete" onclick="logout()">Déconnexion</button>
  </div>

  <!-- Menu Onglets -->
  <div class="admin-tabs">
    <button class="admin-tab active" onclick="switchAdminTab('products')">Produits</button>
    <button class="admin-tab" onclick="switchAdminTab('testimonials')">Témoignages</button>
  </div>

  <!-- ================= VUE PRODUITS ================= -->
  <div id="tab-products">
    <div class="admin-box">
      <h2 id="form-title">Ajouter un produit</h2>
      <form id="add-product-form">
        <div class="lang-tabs">
          <button type="button" class="lang-tab active" onclick="switchLangTab('de')">🇩🇪 DE</button>
          <button type="button" class="lang-tab" onclick="switchLangTab('fr')">🇫🇷 FR</button>
          <button type="button" class="lang-tab" onclick="switchLangTab('it')">🇮🇹 IT</button>
          <button type="button" class="lang-tab" onclick="switchLangTab('en')">🇬🇧 EN</button>
        </div>
        <div id="lang-de" class="lang-content active">
          <div class="form-group"><label>Titre (DE)</label><input type="text" id="p-title-de" required /></div>
          <div class="form-group"><label>Description (DE)</label><textarea id="p-desc-de" rows="3"></textarea></div>
        </div>
        <div id="lang-fr" class="lang-content">
          <div class="form-group"><label>Titre (FR)</label><input type="text" id="p-title-fr" /></div>
          <div class="form-group"><label>Description (FR)</label><textarea id="p-desc-fr" rows="3"></textarea></div>
        </div>
        <div id="lang-it" class="lang-content">
          <div class="form-group"><label>Titre (IT)</label><input type="text" id="p-title-it" /></div>
          <div class="form-group"><label>Description (IT)</label><textarea id="p-desc-it" rows="3"></textarea></div>
        </div>
        <div id="lang-en" class="lang-content">
          <div class="form-group"><label>Titre (EN)</label><input type="text" id="p-title-en" /></div>
          <div class="form-group"><label>Description (EN)</label><textarea id="p-desc-en" rows="3"></textarea></div>
        </div>

        <hr style="border-color: #333; margin: 20px 0;">
        
        <div class="form-group">
          <label>Catégorie</label>
          <select id="p-category" required>
            <option value="mobile_home">Maison Mobile</option>
            <option value="maritime">Conteneur Maritime</option>
            <option value="office">Conteneur Bureau</option>
          </select>
        </div>
        <div class="grid-2">
          <div class="form-group"><label>Prix (€)</label><input type="number" id="p-price" /></div>
          <div class="form-group"><label>Superficie (m²)</label><input type="text" id="p-surface" required /></div>
          <div class="form-group">
            <label>État</label>
            <select id="p-condition"><option value="Neuf">Neuf</option><option value="Occasion">Occasion</option></select>
          </div>
          <div class="form-group"><label>Année</label><input type="number" id="p-year" required /></div>
          <div class="form-group"><label>Longueur</label><input type="text" id="p-length" /></div>
          <div class="form-group"><label>Largeur</label><input type="text" id="p-width" /></div>
        </div>
        
        <div class="form-group" style="margin-top: 15px;">
          <label>Photos du produit</label>
          <input type="file" id="p-images" accept="image/*" multiple />
        </div>
        <div id="image-preview-container" class="image-preview-container"></div>

        <button type="submit" id="btn-submit-product" class="btn-submit">Ajouter le produit</button>
        <button type="button" id="btn-cancel-edit" class="btn-cancel" onclick="resetProductForm()" style="display:none; background:#333; color:#fff; border:none; padding:15px; border-radius:4px; cursor:pointer; width:100%; margin-top:10px;">Annuler la modification</button>
        <p id="status-product" style="text-align: center; margin-top: 15px; font-size: 14px;"></p>
      </form>
    </div>

    <div class="admin-box">
      <h2>Vos produits</h2>
      <div id="products-list">Chargement...</div>
    </div>
  </div>

  <!-- ================= VUE TÉMOIGNAGES ================= -->
  <div id="tab-testimonials" style="display: none;">
    <div class="admin-box">
      <h2>Ajouter un témoignage</h2>
      <form id="add-testimonial-form">
        <div class="form-group">
          <label>Nom du client</label>
          <input type="text" id="t-name" required placeholder="Ex: Jean Dupont" />
        </div>
        <div class="form-group">
          <label>Témoignage (Avis du client)</label>
          <textarea id="t-quote" rows="4" required placeholder="Le texte du témoignage..."></textarea>
        </div>
        <div class="form-group">
          <label>Photo du client</label>
          <input type="file" id="t-image" accept="image/*" required />
        </div>
        <button type="submit" id="btn-submit-testimonial" class="btn-submit">Ajouter le témoignage</button>
        <p id="status-testimonial" style="text-align: center; margin-top: 15px; font-size: 14px;"></p>
      </form>
    </div>

    <div class="admin-box">
      <h2>Vos témoignages</h2>
      <div id="testimonials-list">Chargement...</div>
    </div>
  </div>
</div>

<script type="module" src="admin-produits.js"></script>
</body>
</html>
