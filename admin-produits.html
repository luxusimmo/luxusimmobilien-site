<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LUXUSIMMOBILIEN — Admin Produits</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css" />
<style>
  body { background: #050505; color: #fff; font-family: 'Inter', sans-serif; padding-top: 100px; }
  .admin-container { max-width: 900px; margin: 0 auto; padding: 20px; }
  .admin-box { background: #111; border: 1px solid #222; border-radius: 8px; padding: 30px; margin-bottom: 30px; }
  .admin-box h2 { font-family: 'Space Grotesk', sans-serif; margin-bottom: 20px; font-size: 24px; }
  .form-group { margin-bottom: 15px; }
  .form-group label { display: block; font-size: 13px; color: #888; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 1px; }
  .form-group input, .form-group select, .form-group textarea {
    width: 100%; padding: 12px; background: #050505; border: 1px solid #333; color: #fff; border-radius: 4px; font-family: inherit;
  }
  .form-group input:focus, .form-group select:focus { outline: none; border-color: #fff; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
  .btn-submit { background: #fff; color: #000; border: none; padding: 15px 30px; font-weight: 600; cursor: pointer; border-radius: 4px; width: 100%; transition: 0.3s; margin-top: 20px; }
  .btn-submit:hover { background: #ccc; }
  
  /* Onglets de langue */
  .lang-tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 1px solid #333; padding-bottom: 10px; flex-wrap: wrap; }
  .lang-tab { background: none; border: none; color: #888; cursor: pointer; font-size: 15px; padding: 8px 15px; border-radius: 4px; transition: 0.3s; font-weight: 600; }
  .lang-tab.active { background: #fff; color: #000; }
  .lang-content { display: none; }
  .lang-content.active { display: block; animation: fadeIn 0.3s; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  /* Liste des produits */
  .product-list-item { display: flex; justify-content: space-between; align-items: center; padding: 15px; border-bottom: 1px solid #222; flex-wrap: wrap; gap: 10px; }
  .product-list-item img { width: 60px; height: 60px; object-fit: cover; border-radius: 4px; margin-right: 15px; }
  .product-info { flex: 1; min-width: 200px; }
  .product-info h4 { margin: 0 0 5px 0; font-size: 16px; }
  .product-info p { margin: 0; font-size: 13px; color: #888; }
  .product-actions { display: flex; gap: 10px; }
  
  .btn-edit { background: none; border: 1px solid #fff; color: #fff; padding: 8px 12px; border-radius: 4px; cursor: pointer; transition: 0.3s; }
  .btn-edit:hover { background: #fff; color: #000; }
  .btn-delete { background: none; border: 1px solid #ff4444; color: #ff4444; padding: 8px 12px; border-radius: 4px; cursor: pointer; transition: 0.3s; }
  .btn-delete:hover { background: #ff4444; color: #fff; }
  .btn-cancel { background: #333; color: #fff; border: none; padding: 15px; border-radius: 4px; cursor: pointer; width: 100%; margin-top: 10px; display: none; font-weight: 600; }
  
  .login-view { max-width: 400px; margin: 15vh auto; background: #111; padding: 40px; border-radius: 8px; border: 1px solid #222; }
  .login-view h2 { text-align: center; margin-bottom: 20px; font-family: 'Space Grotesk'; }
</style>
</head>
<body>

<!-- Vue Connexion -->
<div id="login-view" class="login-view">
  <h2>Espace Admin</h2>
  <div class="form-group">
    <input type="email" id="email" placeholder="E-mail" required />
  </div>
  <div class="form-group">
    <input type="password" id="password" placeholder="Mot de passe" required />
  </div>
  <button class="btn-submit" onclick="login()">Se connecter</button>
</div>

<!-- Vue Admin -->
<div id="admin-view" class="admin-container" style="display: none;">
  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
    <h2 style="font-family: 'Space Grotesk'; margin: 0;">Gestion des Produits</h2>
    <button class="btn-delete" onclick="logout()">Déconnexion</button>
  </div>

  <!-- Formulaire d'ajout / modification -->
  <div class="admin-box">
    <h2 id="form-title">Ajouter un nouveau produit</h2>
    <form id="add-product-form">
      
      <div class="lang-tabs">
        <button type="button" class="lang-tab active" onclick="switchTab('de')">🇩🇪 Allemand (Principal)</button>
        <button type="button" class="lang-tab" onclick="switchTab('fr')">🇫🇷 Français</button>
        <button type="button" class="lang-tab" onclick="switchTab('it')">🇮🇹 Italien</button>
        <button type="button" class="lang-tab" onclick="switchTab('en')">🇬🇧 Anglais</button>
      </div>

      <div id="tab-de" class="lang-content active">
        <div class="form-group">
          <label>Titre du produit (DE)</label>
          <input type="text" id="p-title-de" required placeholder="Ex: Luxus Mobilheim 2024" />
        </div>
        <div class="form-group">
          <label>Description (DE)</label>
          <textarea id="p-desc-de" rows="3" placeholder="Beschreibung..."></textarea>
        </div>
      </div>

      <div id="tab-fr" class="lang-content">
        <div class="form-group">
          <label>Titre du produit (FR)</label>
          <input type="text" id="p-title-fr" placeholder="Ex: Maison Mobile de Luxe 2024" />
        </div>
        <div class="form-group">
          <label>Description (FR)</label>
          <textarea id="p-desc-fr" rows="3" placeholder="Description..."></textarea>
        </div>
      </div>

      <div id="tab-it" class="lang-content">
        <div class="form-group">
          <label>Titre du produit (IT)</label>
          <input type="text" id="p-title-it" placeholder="Ex: Casa Mobile di Lusso 2024" />
        </div>
        <div class="form-group">
          <label>Description (IT)</label>
          <textarea id="p-desc-it" rows="3" placeholder="Descrizione..."></textarea>
        </div>
      </div>

      <div id="tab-en" class="lang-content">
        <div class="form-group">
          <label>Titre du produit (EN)</label>
          <input type="text" id="p-title-en" placeholder="Ex: Luxury Mobile Home 2024" />
        </div>
        <div class="form-group">
          <label>Description (EN)</label>
          <textarea id="p-desc-en" rows="3" placeholder="Description..."></textarea>
        </div>
      </div>

      <hr style="border-color: #333; margin: 30px 0;">
      
      <div class="form-group">
        <label>Catégorie</label>
        <select id="p-category" required>
          <option value="mobile_home">Maison Mobile</option>
          <option value="maritime">Conteneur Maritime</option>
          <option value="office">Conteneur Bureau</option>
        </select>
      </div>
      <div class="grid-2">
        <div class="form-group">
          <label>Prix (€)</label>
          <input type="number" id="p-price" placeholder="45000" />
        </div>
        <div class="form-group">
          <label>Superficie (m²)</label>
          <input type="text" id="p-surface" required placeholder="45 m²" />
        </div>
        <div class="form-group">
          <label>État</label>
          <select id="p-condition">
            <option value="Neuf">Neuf</option>
            <option value="Occasion">Occasion</option>
          </select>
        </div>
        <div class="form-group">
          <label>Année</label>
          <input type="number" id="p-year" required placeholder="2024" />
        </div>
        <div class="form-group">
          <label>Longueur</label>
          <input type="text" id="p-length" placeholder="12m" />
        </div>
        <div class="form-group">
          <label>Largeur</label>
          <input type="text" id="p-width" placeholder="3m" />
        </div>
      </div>
      
      <div class="form-group" style="margin-top: 20px;">
        <label>Photos du produit (Laissez vide pour garder les anciennes lors d'une modification)</label>
        <input type="file" id="p-images" accept="image/*" multiple />
      </div>

      <button type="submit" id="btn-submit-form" class="btn-submit">Ajouter le produit</button>
      <button type="button" id="btn-cancel-edit" class="btn-cancel" onclick="resetForm()">Annuler la modification</button>
      
      <p id="status-msg" style="text-align: center; margin-top: 15px; font-size: 14px;"></p>
    </form>
  </div>

  <div class="admin-box">
    <h2>Vos produits en ligne</h2>
    <div id="products-list">Chargement...</div>
  </div>
</div>

<script type="module" src="admin-produits.js"></script>
</body>
</html>
